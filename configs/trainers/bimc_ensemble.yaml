SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4


MODEL:
  BACKBONE:
    NAME: "ViT-B/16"  #  RN50  RN101  ViT-B/32  ViT-B/16  ViT-L/14
  

TRAINER:
  BiMC:
    PREC: "fp16"  # fp16, fp32, amp

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1 
    TAU: 16        

    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0

    USING_ENSEMBLE: True

    FUSION_BETA_MODE: "fixed"
    FUSION_GEOMETRY: "linear"
    BETA_TEMPERATURE: 0.05
    BETA_CLIP_MIN: 0.05
    BETA_CLIP_MAX: 0.95
    RELIABILITY_MODE: "entropy_margin"
    SAVE_PHASE1_REPORT: True

    PHASE2:
      ENABLED: false

      VISUAL_PROTO_MODE: "mean"
      # allowed: "mean", "robust_weighted", "shrinkage_base_prior"

      ROBUST_KAPPA: 16.0
      ROBUST_DROP_LOWEST: false

      SHRINKAGE_PRIOR: "base_neighbors"
      # allowed: "base_neighbors", "text", "zero"

      SHRINKAGE_EPS: 1e-8
      SHRINKAGE_MIN: 0.0
      SHRINKAGE_MAX: 1.0

      DYNAMIC_LAMBDA_I: false
      DYNAMIC_LAMBDA_MIN: 0.0
      DYNAMIC_LAMBDA_MAX: 0.5

      TEXT_PROTO_MODE: "mean"
      # allowed: "mean", "discriminative_reweight", "visual_grounded_reweight", "combined_reweight", "topk_discriminative"

      DESC_TEMP: 0.05
      DESC_LAMBDA_D: 0.5
      DESC_TOPK: 5

      SAVE_PHASE2_REPORT: true

    PHASE5:
      ENABLED: false

      SPACE_TRANSFORM: "none"
      # allowed: "none", "common_direction_removal", "whitening", "lda_shrinkage"

      APPLY_TO: "all"
      # allowed: "query_only", "prototype_only", "all"

      CDR_RHO: 0.5
      CDR_SOURCE: "prototypes"
      # allowed: "prototypes", "base_features", "all_seen_features"

      WHITENING_EPS: 1e-4
      WHITENING_SOURCE: "base_features"
      WHITENING_DIAG_ONLY: true

      LDA_DIM: 256
      LDA_GAMMA: 1e-3
      LDA_NOVEL_WEIGHT: 0.1
      LDA_SOURCE: "base_plus_support"
      LDA_USE_SHRINKAGE: true

      SAVE_PHASE5_REPORT: true

    PHASE6:
      ENABLED: false

      ALIGNMENT_MODE: "none"
      # allowed: "none", "ot_text_image", "support_aware_text", "label_prior_correction"

      OT_EPS: 0.05
      OT_MAX_ITER: 50
      OT_USE_SINKHORN: true
      OT_NORMALIZE_COST: true

      SUPPORT_AWARE_TEXT_TEMP: 0.05
      SUPPORT_AWARE_TEXT_TOPK: 0

      LABEL_PRIOR_ENABLED: false
      LABEL_PRIOR_MODE: "blackbox_shift"
      # allowed: "blackbox_shift", "prediction_frequency", "uniform_smoothing"

      LABEL_PRIOR_STRENGTH: 0.5
      LABEL_PRIOR_EPS: 1e-8
      LABEL_PRIOR_MAX_ITER: 20
      LABEL_PRIOR_TRANSDUCTIVE: true

      SAVE_PHASE6_REPORT: true

    PHASE7:
      ENABLED: false

      SEPARATION_MODE: "none"
      # allowed: "none", "hubness_safe_repulsion", "prototype_repulsion", "graph_highpass"

      REPULSION_DELTA: 0.03
      REPULSION_MARGIN: 0.0
      REPULSION_TOPK: 5
      REPULSION_ONLY_IF_SIM_ABOVE_MARGIN: true
      REPULSION_SOURCE: "mixed"
      # allowed: "mixed", "text", "visual"

      GRAPH_TAU: 0.05
      GRAPH_GAMMA: 0.03
      GRAPH_TOPK: 5
      GRAPH_NORMALIZE_ADJ: true

      SAVE_PHASE7_REPORT: true
