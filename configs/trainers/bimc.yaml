SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4


MODEL:
  BACKBONE:
    NAME: "ViT-B/16"  #  RN50  RN101  ViT-B/32  ViT-B/16  ViT-L/14
  

TRAINER:
  BiMC:
    PREC: "fp16"  # fp16, fp32, amp

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1 
    TAU: 16        

    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0

    USING_ENSEMBLE: False

    FUSION_BETA_MODE: "fixed"
    FUSION_GEOMETRY: "linear"
    BETA_TEMPERATURE: 0.05
    BETA_CLIP_MIN: 0.05
    BETA_CLIP_MAX: 0.95
    RELIABILITY_MODE: "entropy_margin"
    SAVE_PHASE1_REPORT: True

    PHASE3:
      ENABLED: false

      HUBNESS_ENABLED: false
      HUBNESS_SOURCE: "mixed"
      # allowed: "mixed", "text", "visual", "all"
      HUBNESS_TAU: 0.05
      HUBNESS_LAMBDA: 0.05
      HUBNESS_TOPK: 0
      # 0 means use all prototypes. Otherwise use top-k nearest prototypes.

      TEMP_SCALING_ENABLED: false
      TEMP_CALIB: 1.0
      TEMP_COV: 1.0
      TEMP_NN: 1.0
      TEMP_TEXT: 1.0
      TEMP_VISUAL: 1.0

      ENERGY_ENABLED: false
      ENERGY_TEMP: 1.0
      ENERGY_NORMALIZE: true

      DYNAMIC_ALPHA_ENABLED: false
      DYNAMIC_ALPHA_MODE: "entropy_margin"
      # allowed:
      # "margin"
      # "entropy"
      # "entropy_margin"
      # "energy"
      # "entropy_margin_energy"

      ALPHA_CLIP_MIN: 0.05
      ALPHA_CLIP_MAX: 0.95
      ALPHA_EPS: 1e-8

      SAVE_PHASE3_REPORT: true

    PHASE4:
      ENABLED: false

      COV_MODE: "original"
      # allowed:
      # "original"
      # "diag_shrinkage"
      # "base_borrowed_diag"
      # "hybrid_diag"

      APPLY_TO_NOVEL: true
      APPLY_TO_BASE: false

      COV_SHRINKAGE_LAMBDA: 0.5
      COV_EPS: 1e-4
      COV_TAU: 16.0

      COV_PRIOR: "base_neighbors"
      # allowed:
      # "base_neighbors"
      # "global"
      # "identity"

      COV_SCORE_TEMP: 1.0
      COV_SCORE_WEIGHT: 1.0

      REPLACE_NOVEL_NN: false
      # If true, use phase4 covariance score instead of CMNN for novel classes.
      # If false, report it as an additional auxiliary and optionally combine.

      NOVEL_AUX_COMBINE_MODE: "alpha"
      # allowed: "alpha", "average", "max", "replace"

      SAVE_PHASE4_REPORT: true
