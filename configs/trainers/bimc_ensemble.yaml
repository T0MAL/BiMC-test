SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 64
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 4


MODEL:
  BACKBONE:
    NAME: "ViT-B/16"  #  RN50  RN101  ViT-B/32  ViT-B/16  ViT-L/14
  

TRAINER:
  BiMC:
    PREC: "fp16"  # fp16, fp32, amp

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1 
    TAU: 16        

    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

    GAMMA_BASE: 1.0
    GAMMA_INC: 5.0

    USING_ENSEMBLE: True

    FUSION_BETA_MODE: "fixed"
    FUSION_GEOMETRY: "linear"
    BETA_TEMPERATURE: 0.05
    BETA_CLIP_MIN: 0.05
    BETA_CLIP_MAX: 0.95
    RELIABILITY_MODE: "entropy_margin"
    SAVE_PHASE1_REPORT: True

    PHASE2:
      ENABLED: False
      VISUAL_PROTO_MODE: "original"
      TEXT_PROTO_MODE: "original"
      DYNAMIC_LAMBDA_I: False
      VISUAL_SHRINKAGE: 0.1
      TEXT_REWEIGHT_TAU: 10.0
      TEXT_COMBINE_WEIGHT: 0.5

    PHASE3:
      ENABLED: False
      TEMP_SCALING_ENABLED: False
      TEMP_VALUE: 1.0
      ENERGY_ENABLED: False
      DYNAMIC_ALPHA_ENABLED: False
      DYNAMIC_ALPHA_MODE: "entropy_margin"
      ALPHA_CLIP_MIN: 0.05
      ALPHA_CLIP_MAX: 0.95
      HUBNESS_ENABLED: False
      HUBNESS_SOURCE: "support"
      HUBNESS_STRENGTH: 0.1

    PHASE4:
      ENABLED: False
      COV_MODE: "original"
      APPLY_TO_NOVEL: False
      REPLACE_NOVEL_NN: False
      NOVEL_AUX_COMBINE_MODE: "average"
      HYBRID_DIAG_WEIGHT: 0.5
      EPS: 1.0e-4

    PHASE5:
      ENABLED: False
      SPACE_TRANSFORM: "none"
      APPLY_TO: "all"
      STRENGTH: 1.0
      EPS: 1.0e-6

    PHASE6:
      ENABLED: False
      ALIGNMENT_MODE: "none"
      ALIGNMENT_STRENGTH: 0.25
      OT_TAU: 10.0
      LABEL_PRIOR_ENABLED: False
      LABEL_PRIOR_TRANSDUCTIVE: False
      LABEL_PRIOR_STRENGTH: 0.25

    PHASE7:
      ENABLED: False
      SEPARATION_MODE: "none"
      SEPARATION_STRENGTH: 0.15
      GRAPH_K: 5
